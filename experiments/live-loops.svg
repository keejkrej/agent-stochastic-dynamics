  <text x="114" y="72" text-anchor="middle" font-family="Times, serif" font-size="10">p_hit = 0/12 at τ=0 and 0.7</text>
  <rect x="48" y="92" width="132" height="28" fill="#dce6f5" stroke="#1f4e8c"/>
