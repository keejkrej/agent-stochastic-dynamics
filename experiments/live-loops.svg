  <text x="320" y="72" text-anchor="middle" font-family="Times, serif" font-size="10">p_hit = 0/12 at τ=0 and 0.7</text>
  <rect x="254" y="92" width="132" height="28" fill="#f3ddd4" stroke="#b85c38"/>
